name: Phase26 official ASM exact-binary WAS diagnostics (never auto-deploy)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: runtimesbom-phase26-${{ github.ref }}
  cancel-in-progress: false
jobs:
  official-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline negative/CI contract tests
        run: |
          python3 -m unittest discover -s tests -p 'test_phase24_*.py' -v
          python3 -m unittest discover -s tests -p 'test_phase25_*.py' -v
          python3 scripts/phase24-ci-contract.py
      - name: Phase26 Spring Boot 3 metadata regression and Maven diagnostics unit tests
        run: |
          python3 -m unittest discover -s tests -p 'test_phase26_*.py' -v
          sh scripts/phase26-springboot3-metadata-test.sh
      - name: Official ASM configuration/toolchain preflight
        run: python3 scripts/phase25-build-preflight.py --require-toolchain
      - name: Real Maven ASM 9.7.1 build and exhaustive SHA/bytecode audit
        run: |
          sh scripts/phase22-official-build.sh
          python3 scripts/phase24-check-binary.py
      - name: Spring Boot 3 nested-JAR provenance regression (official ASM)
        run: |
          sh scripts/phase26-springboot3-metadata-test.sh
          sh scripts/phase26-boot3-agent-smoke.sh official
      - name: Diagnose official build failure without masking it
        if: always()
        run: |
          python3 scripts/phase25-ci-diagnose.py \
            --log results/phase22/maven-package.log \
            --log results/phase22/asm-dependency-tree.log \
            --out results/phase25/ci-diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase26-official-exact-binary
          path: |
            target/runtime-sbom-agent-1.0.0-rc16.jar
            results/phase22/build.json
            results/phase22/binary-audit.json
            results/phase22/maven-package.log
            results/phase22/asm-dependency-tree.log
            results/phase25/build-preflight.json
            results/phase25/ci-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
  boot2-build-isolation:
    # Independent of the Agent: exposes the Spring Boot 2 Maven root cause directly.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated Spring Boot 2 Maven package on Java 8 (capture real errors)
        shell: bash
        run: |
          mkdir -p results/phase26/boot2-build
          set +e
          mvn -f integration/apps/spring-boot2/pom.xml -B -e -DskipTests clean package > results/phase26/boot2-build/build.log 2>&1
          rc=$?
          set -e
          tail -n 70 results/phase26/boot2-build/build.log
          exit "$rc"
      - name: Diagnose Spring Boot 2 build failure
        if: always()
        run: |
          python3 scripts/phase26-ci-diagnostics.py \
            --log results/phase26/boot2-build/build.log \
            --out results/phase26/boot2-build/diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase26-boot2-isolated-build-log
          path: results/phase26/boot2-build/
          if-no-files-found: warn
  jdk-matrix:
    needs: official-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        jdk: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: phase26-official-exact-binary
          path: .
      - name: Verify artifact SHA from build job before executing it
        run: python3 scripts/phase24-check-binary.py
      - name: JDK ${{ matrix.jdk }} executable smoke and evidence
        run: sh scripts/phase22-jdk-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase26-jdk-${{ matrix.jdk }}
          path: results/phase22/jdk/
          if-no-files-found: warn
  was-matrix:
    needs: official-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: spring-boot2, jdk: '8'}
          - {app: spring-boot3, jdk: '17'}
          - {app: tomcat9, jdk: '8'}
          - {app: tomcat10, jdk: '17'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: phase26-official-exact-binary
          path: .
      - name: Verify official binary integrity before starting WAS
        run: python3 scripts/phase24-check-binary.py
      - name: Download pinned checksum-verified Tomcat staging installation
        if: startsWith(matrix.app, 'tomcat')
        run: |
          if [ "${{ matrix.app }}" = 'tomcat9' ]; then
            sh scripts/phase22-install-tomcat.sh 9.0.107 "$RUNNER_TEMP/tomcat"
          else
            sh scripts/phase22-install-tomcat.sh 10.1.43 "$RUNNER_TEMP/tomcat"
          fi
      - name: Actual HTTP + exact JAR byte SHA + method-entry evidence
        run: |
          if [ "${{ matrix.app }}" = tomcat9 ] || [ "${{ matrix.app }}" = tomcat10 ]; then
            python3 scripts/phase21-staging-live.py --app '${{ matrix.app }}' --tomcat-home "$RUNNER_TEMP/tomcat" --out-dir results/phase22/live --duration 12 --concurrency 8
          else
            python3 scripts/phase21-staging-live.py --app '${{ matrix.app }}' --out-dir results/phase22/live --duration 12 --concurrency 8
          fi
      - name: Emit Maven/WAS root-cause diagnostic even if integration failed
        if: always()
        run: |
          python3 scripts/phase26-ci-diagnostics.py \
            --log "results/phase22/live/${{ matrix.app }}/build.log" \
            --log "results/phase22/live/${{ matrix.app }}/phase21-live-command.log" \
            --log "results/phase22/live/${{ matrix.app }}/asm-traced/server.log" \
            --out "results/phase22/live/${{ matrix.app }}/phase26-diagnostic.json"
      - name: Preserve WAS directory when uploading per-matrix evidence
        if: always()
        run: |
          mkdir -p "ci/was-evidence/${{ matrix.app }}"
          if [ -d "results/phase22/live/${{ matrix.app }}" ]; then
            cp -a "results/phase22/live/${{ matrix.app }}/." "ci/was-evidence/${{ matrix.app }}/"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase26-was-${{ matrix.app }}
          path: ci/was-evidence/
          if-no-files-found: warn
  review:
    needs: [official-build, boot2-build-isolation, jdk-matrix, was-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: phase26-official-exact-binary
          path: .
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: phase26-jdk-*
          path: results/phase22/jdk
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: phase26-was-*
          path: results/phase22/live
          merge-multiple: true
      - name: Fail closed on missing/mismatched binary, JDK/WAS, or SBOM quality evidence
        run: python3 scripts/phase24-staging-manifest.py
      - name: Require official build and all test jobs to have passed
        if: always()
        run: |
          test '${{ needs.official-build.result }}' = 'success'
          test '${{ needs.boot2-build-isolation.result }}' = 'success'
          test '${{ needs.jdk-matrix.result }}' = 'success'
          test '${{ needs.was-matrix.result }}' = 'success'
      - name: Save consolidated approval HOLD reasons even when previous step failed
        if: always()
        env:
          PHASE26_REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: python3 scripts/phase25-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase26-exact-binary-review-report
          path: |
            results/phase24/staging-manifest.json
            results/phase25/release-review.json
          if-no-files-found: warn
