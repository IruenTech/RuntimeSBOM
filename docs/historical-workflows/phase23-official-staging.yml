name: Phase23 official ASM + SBOM quality evidence (staging only)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  official-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Official Maven ASM 9.7.1 build + exhaustive bytecode audit
        run: sh scripts/phase22-official-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: phase23-official-exact-agent
          path: target/runtime-sbom-agent-1.0.0-rc15.jar
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase23-build-proof
          path: results/phase22/
          if-no-files-found: warn
  jdk-smoke:
    needs: official-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['8','11','17','21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: phase23-official-exact-agent
          path: target
      - name: Execute same SHA-256 Agent under current JDK
        run: sh scripts/phase22-jdk-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase23-jdk-${{ matrix.jdk }}
          path: results/phase22/
          if-no-files-found: warn
  actual-was:
    needs: official-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: spring-boot2
            jdk: '8'
          - app: spring-boot3
            jdk: '17'
          - app: tomcat9
            jdk: '8'
          - app: tomcat10
            jdk: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: phase23-official-exact-agent
          path: target
      - name: Prepare pinned Tomcat distribution (staging only)
        if: startsWith(matrix.app, 'tomcat')
        run: |
          if [ "${{ matrix.app }}" = tomcat9 ]; then
            sh scripts/phase22-install-tomcat.sh 9.0.107 "$RUNNER_TEMP/tomcat"
          else
            sh scripts/phase22-install-tomcat.sh 10.1.43 "$RUNNER_TEMP/tomcat"
          fi
      - name: Real Spring Boot/Tomcat HTTP + embedded JAR hash + method execution
        run: |
          if [ "${{ matrix.app }}" = tomcat9 ] || [ "${{ matrix.app }}" = tomcat10 ]; then
            python3 scripts/phase21-staging-live.py --app '${{ matrix.app }}' --tomcat-home "$RUNNER_TEMP/tomcat" --out-dir results/phase22/live --duration 12 --concurrency 8
          else
            python3 scripts/phase21-staging-live.py --app '${{ matrix.app }}' --out-dir results/phase22/live --duration 12 --concurrency 8
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase23-was-${{ matrix.app }}
          path: results/phase22/
          if-no-files-found: warn
  evidence-gate:
    needs: [official-build, jdk-smoke, actual-was]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: phase23-official-exact-agent
          path: target
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: phase23-build-proof
          path: results/phase22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: phase23-jdk-*
          path: results/phase22
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: phase23-was-*
          path: results/phase22
          merge-multiple: true
      - name: Fail-closed exact-binary acceptance; production remains HOLD
        run: python3 scripts/phase23-staging-gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase23-acceptance-report
          path: results/phase23/staging-gate.json
          if-no-files-found: warn
