name: Phase18 official ASM shaded agent verification
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  release-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile official ASM 9.7.1 and shade the Agent once
        run: mvn -B -DskipTests clean package
      - name: Check Java 8 Agent packaging and SHA-256
        run: python3 scripts/phase18-audit-jar.py target/runtime-sbom-agent-1.0.0-rc12.jar --out results/phase18/official-jar-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase18-official-release-jar
          path: target/runtime-sbom-agent-1.0.0-rc12.jar
          if-no-files-found: error

  jdk-matrix:
    needs: release-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8','11','17','21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: phase18-official-release-jar
          path: target
      - name: Verify exact release binary, execute method, class loaders, nested archive
        run: sh scripts/phase18-verify-official-binary.sh
      - name: Collect evidence under JDK-specific filename
        run: mkdir -p results/phase18/jdk-matrix && cp results/phase18/jdk-evidence.json results/phase18/jdk-matrix/jdk-${{ matrix.java }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase18-jdk-${{ matrix.java }}-evidence
          path: |
            results/phase18/
            target/phase18-official-verification/*.log
            results/phase17/loader-official.json
          if-no-files-found: warn

  spring-live:
    needs: release-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: spring-boot2
            java: '8'
          - app: spring-boot3
            java: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: phase18-official-release-jar
          path: target
      - name: Run baseline, class-loaded-only and ASM-traced live HTTP
        run: python3 scripts/phase14-live-was.py --app ${{ matrix.app }} --duration 10 --concurrency 8 --out-dir results/phase18/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase18-${{ matrix.app }}-evidence
          path: results/phase18/live/${{ matrix.app }}/
          if-no-files-found: warn

# Tomcat 9 / 10.1 require a preapproved staging distribution and CATALINA_HOME.
# JEUS, WebLogic and AIX require licensed vendor installations and authorized runners.
# All CI checks remain evidence for human staging review; not production approval.
